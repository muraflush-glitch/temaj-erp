name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: temaj_erp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/temaj_erp_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Testi i ndërfaqes me Chrome
        run: scripts/e2e-local.sh
        env:
          E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/temaj_erp_e2e
      - name: Prova që punon brenda shfletuesit (pa server)
        run: npm run demo:build && node apps/demo/e2e.mjs

  # Provon skedarët e ngritjes në server: ndërton imazhin, nis databazën, API-n dhe web-in, dhe hyn në sistem përmes web-it.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ndërto dhe nis mjedisin provë
        working-directory: deploy
        run: |
          printf 'SITE_ADDRESS=localhost\nDB_PASSWORD=ci-test-password-123\nSECRET_KEYS=k1:%s\nSECRET_ACTIVE_KEY_ID=k1\n' "$(openssl rand -base64 32)" > .env
          docker compose up -d --build db api web
          for i in $(seq 1 60); do
            docker compose exec -T web node -e "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && break
            sleep 3
          done
          docker compose exec -T -e SEED_ADMIN_PASSWORD=Admin-CI-Fjalekalim-1 -e SEED_APPROVER_PASSWORD=Aprovues-CI-Fjalekalim-1 -e SEED_DEMO_PASSWORD=Demo-CI-Fjalekalim-1 api node apps/api/dist/database/seed.cli.js
          docker compose exec -T web node -e "fetch('http://localhost:3000/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:'demo@temaj.test',password:'Demo-CI-Fjalekalim-1'})}).then(async r=>{const b=await r.json();if(!b.token){console.error(b);process.exit(1)}console.log('Hyrja përmes web-it funksionon')})"
          docker compose exec -T web node -e "fetch('http://localhost:3000/hyrja').then(async r=>{const t=await r.text();if(!r.ok||!t.includes('Temaj ERP'))process.exit(1);console.log('Faqja e hyrjes shërbehet')})"
      - name: Log-et në rast dështimi
        if: failure()
        working-directory: deploy
        run: docker compose logs --tail 100

  # Provon mjedisin e Codespaces: e ndërton, e përgatit dhe hyn në sistem me përdoruesin demo.
  codespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            set -e
            bash .devcontainer/start.sh
            set -a; . ./.env.prove; set +a
            node -e "fetch('http://localhost:3000/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:'demo@temaj.test',password:process.env.SEED_DEMO_PASSWORD})}).then(async r=>{const b=await r.json();if(!b.token){console.error(b);process.exit(1)}console.log('Hyrja me përdoruesin demo funksionon')})"
            grep -q 'demo@temaj.test' HYRJA.txt

  # Provon instalimin në një server Ubuntu ku punon tashmë një faqe tjetër pas Caddy (si porosi.transportitemaj.com):
  # instalon, hyn në sistem, përsërit instalimin si përditësim dhe verifikon që faqja ekzistuese nuk preket.
  vps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: scripts/package-vps.sh "$PWD/temaj-erp.zip"
      - name: Përgatit një server me një faqe ekzistuese pas Caddy
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor --yes -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list >/dev/null
          sudo apt-get update -y -qq && sudo apt-get install -y -qq caddy
          printf 'porosi.localhost {\n\trespond "faqja ekzistuese"\n}\n' | sudo tee /etc/caddy/Caddyfile >/dev/null
          sudo systemctl restart caddy
          sleep 2
          curl -sk --resolve porosi.localhost:443:127.0.0.1 https://porosi.localhost | grep -q "faqja ekzistuese"
      - name: Instalimi i parë
        run: |
          sudo unzip -q -o temaj-erp.zip -d /root
          sudo bash /root/temaj-erp/install.sh erp.localhost
      - name: Verifikimi
        run: |
          set -e
          PW=$(sudo awk '/^Fjalëkalimi:/ {print $2; exit}' /root/temaj-erp/HYRJA.txt)
          login() { curl -sk --resolve erp.localhost:443:127.0.0.1 https://erp.localhost/api/auth/login -H 'Content-Type: application/json' -d "{\"email\":\"demo@temaj.test\",\"password\":\"$PW\"}"; }
          login | grep -q '"token"' && echo "Hyrja përmes HTTPS funksionon"
          curl -sk --resolve erp.localhost:443:127.0.0.1 https://erp.localhost/hyrja | grep -q "Temaj ERP"
          curl -sk --resolve porosi.localhost:443:127.0.0.1 https://porosi.localhost | grep -q "faqja ekzistuese" && echo "Faqja ekzistuese vazhdon të punojë"
          # API-ja nuk duhet të jetë e arritshme nga jashtë: dëgjon vetëm në 127.0.0.1.
          sudo ss -ltnp | grep ':4100' | grep -q '127.0.0.1' && echo "API-ja dëgjon vetëm lokalisht"
          sudo test "$(sudo stat -c %a /root/temaj-erp/.env)" = 600
          # Përditësimi: i njëjti instalim sërish nuk i ndryshon fjalëkalimet as të dhënat, dhe nuk e dyfishon faqen te Caddy.
          sudo unzip -q -o temaj-erp.zip -d /root
          sudo bash /root/temaj-erp/install.sh erp.localhost
          login | grep -q '"token"' && echo "Pas përditësimit hyrja funksionon me të njëjtin fjalëkalim"
          test "$(sudo grep -c 'erp.localhost' /etc/caddy/Caddyfile)" = 1
          sudo test -x /etc/cron.daily/temaj-erp-kopje && sudo /etc/cron.daily/temaj-erp-kopje && sudo ls /root/kopje/erp | grep -q 'sql.gz' && echo "Kopja rezervë krijohet"
      - name: Log-et në rast dështimi
        if: failure()
        run: sudo journalctl -u temaj-erp-api -u temaj-erp-web -u caddy -n 80 --no-pager
