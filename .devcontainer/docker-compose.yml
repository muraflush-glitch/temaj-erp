# Mjedis provë për GitHub Codespaces: aplikacioni dhe databaza. Vetëm të dhëna testuese.
services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:22
    volumes:
      - ..:/workspaces/temaj-erp:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgres://temaj:temaj-prove@db:5432/temaj_erp
      APP_ENV: development
    depends_on:
      - db
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: temaj
      POSTGRES_PASSWORD: temaj-prove
      POSTGRES_DB: temaj_erp
